[project]
name = "research-agent"
version = "0.1.0"
description = "Streaming web-search research assistant"
readme = "README.md"
authors = [
    { name = "Rich Guilmain", email = "richguilmain@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.3.9,<4",
    "psycopg-pool>=3.2,<4",
    "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
    "respx>=0.22,<1", "ruff>=0.14,<1", "pyright>=1.1,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# An empty local migration directory must not change Alembic's import classification.
known-third-party = ["alembic"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=research_agent --cov-report=term-missing"

[project.scripts]
research-agent = "research_agent.main:run"
research-agent-check-models = "research_agent.check_models:run"
research-agent-migrate = "research_agent.maintenance:migrate"
research-agent-cleanup = "research_agent.maintenance:cleanup"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

services:
  api:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      APP_ENV: development
      DEMO_MODE: 'true'
      DEFAULT_MODEL: gpt-6-luna
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
volumes:
  web_modules:
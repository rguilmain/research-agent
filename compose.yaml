services:
  db:
    image: postgres:17.7-alpine
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      POSTGRES_USER: research_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: research_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U research_dev -d research_agent']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      APP_ENV: development
      DEMO_MODE: 'true'
      DEFAULT_MODEL: gpt-6-luna
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
volumes:
  postgres_data:
  web_modules: